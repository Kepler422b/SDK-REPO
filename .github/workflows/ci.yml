name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: smart-disaster-repo/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: smart-disaster-repo/frontend
        run: npm ci

      - name: Build frontend
        working-directory: smart-disaster-repo/frontend
        run: npm run build

  backend-syntax:
    name: Backend syntax check
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check backend source syntax
        run: |
          node --check smart-disaster-repo/backend/server.js
          node --check smart-disaster-repo/backend/routes/reports.js
